  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress disabled HMR/WebSocket errors in iframe sandbox
      (function() {
        function filter(msg) {
          return msg && (
            msg.indexOf("Cannot read properties of undefined (reading 'send')") !== -1 ||
            msg.indexOf("reading 'send'") !== -1 ||
            msg.indexOf("WebSocket") !== -1 ||
            msg.indexOf("HMR") !== -1
          );
        }
        window.addEventListener('error', function(e) {
          if (filter(e.message) || (e.error && filter(e.error.message))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var str = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (filter(str)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
